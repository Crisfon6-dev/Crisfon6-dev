<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Adversarial review loop</title>
  <desc id="d">Two blind judges review in parallel. A synthesizer confirms findings. A fixer applies only confirmed defects. The loop repeats until zero confirmed criticals.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker></defs>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g fill="#1e293b" stroke="#334155" stroke-width="2">
      <rect x="40" y="36" width="210" height="80" rx="12"/>
      <rect x="40" y="156" width="210" height="80" rx="12"/>
      <rect x="360" y="96" width="250" height="80" rx="12"/>
      <rect x="720" y="96" width="240" height="80" rx="12"/>
    </g>
    <g fill="#f8fafc" font-size="26" font-weight="700">
      <text x="145" y="72">Judge A</text><text x="145" y="192">Judge B</text>
      <text x="485" y="132">Synthesizer</text><text x="840" y="132">Fixer</text>
    </g>
    <g fill="#cbd5e1" font-size="19">
      <text x="145" y="100">blind</text><text x="145" y="220">blind</text>
      <text x="485" y="158">confirms findings</text><text x="840" y="158">confirmed defects only</text>
    </g>
    <text x="500" y="268" font-size="21" font-weight="600" fill="#60a5fa">loop until zero confirmed criticals</text>
  </g>
  <g fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)">
    <path d="M250 76 L358 126"/><path d="M250 196 L358 146"/>
    <path d="M610 136 L718 136"/>
    <path d="M840 176 V282 H145 V240"/>
  </g>
</svg>
